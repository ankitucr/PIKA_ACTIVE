name: PIKA Core Safety Regression

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "host_attestor/**"
      - "tests/**"
      - "pika_live.py"
      - "pika_pc.py"
      - "sandbox/pc/**"
      - "main.py"
      - "pika.py"
      - "agents/**"
      - "memory/**"
      - "workspace/**"
      - "learning/**"
      - "evaluation/**"
      - "tools/**"
      - "config/**"
      - "remote_bridge/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/pika-core-safety.yml"
      - ".github/workflows/pika-isolated-candidate-ci.yml"
  pull_request:
    branches: [main, phase37-3/result-bound-attestation, phase37-4/production-trust-gates, phase38/pc-body-on-phase37, phase39/native-reasoning-core, phase40/multilang-structural-learning, phase41/native-self-evolution-loop, phase42/consolidated-native-trust, phase42/native-code-impact-analysis, phase43/native-test-impact-planning, phase44/native-change-set-impact, phase45/source-graph-evolution-convergence, phase47/evidence-driven-hypothesis-engine]
    paths:
      - "core/**"
      - "PIKA_KNOWLEDGE/**"
      - "tests/**"
      - "pika_live.py"
      - "pika_pc.py"
      - "sandbox/pc/**"
      - "main.py"
      - "pika.py"
      - "agents/**"
      - "memory/**"
      - "workspace/**"
      - "learning/**"
      - "evaluation/**"
      - "tools/**"
      - "config/**"
      - "remote_bridge/**"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/pika-core-safety.yml"
      - ".github/workflows/pika-isolated-candidate-ci.yml"

permissions:
  contents: read

jobs:
  phase36-trust-and-repair:
    name: Python ${{ matrix.python-version }} safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/pika-core-safety.yml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.2.0 pytest-asyncio==1.5.0 cryptography==50.0.2

      - name: Compile all first-party Python
        run: python -m compileall -q core agents tests host_attestor pika_live.py pika_pc.py main.py pika.py remote_bridge sandbox/pc/worker.py

      - name: Prepare best-effort local diagnostic venv (not an OS sandbox)
        run: python -m core.evolution.local_runner setup

      - name: Run Phase 46 experiment-quality contract
        run: python -m pytest -q tests/test_phase46_experiment_quality.py

      - name: Run Phase 47 improvement-hypothesis contract
        run: python -m pytest -q tests/test_native_improvement_hypotheses.py

      - name: Run Phase 48/49 capability intake and isolated evaluation contract
        run: python -m pytest -q tests/test_native_capability_bundle.py

      - name: Run Phase 50 attested capability-delta contract
        run: python -m pytest -q tests/test_phase50_capability_attestation.py

      - name: Run focused safety and learning regressions
        run: |
          python -m pytest -q \
            tests/test_phase35_verified_save.py \
            tests/test_phase36_attestor_config.py \
            tests/test_phase36_4_attestation.py \
            tests/test_phase36_5_attestor_policy.py \
            tests/test_phase36_7_staging.py \
            tests/test_phase36_8_ledger_presence.py \
            tests/test_phase36_failure_analysis.py \
            tests/test_phase36_failure_context.py \
            tests/test_phase36_local_diagnostics.py \
            tests/test_pika_brain_native_generator_integration.py \
            tests/test_live_runtime_think_handoff.py \
            tests/test_phase37_native_capability_short_circuit.py \
            tests/test_phase37_traceback_source_context.py \
            tests/test_phase37_host_attestor.py \
            tests/test_phase37_remote_backend.py \
            tests/test_phase37_production_gates.py \
            tests/test_pc_body.py \
            tests/test_pc_docker_sandbox.py \
            tests/test_evolution_meta_learning.py \
            tests/test_tool_permission_manifest.py \
            tests/test_native_symbolic_reasoning.py \
            tests/test_native_reasoning.py \
            tests/test_native_knowledge_graph_adapter.py \
            tests/test_native_code_proof_queries.py \
            tests/test_native_code_impact_analysis.py \
            tests/test_native_test_impact_planner.py \
            tests/test_native_change_set_analysis.py \
            tests/test_native_evolution.py \
            tests/test_native_multilang_analyzer.py \
            tests/test_phase42_consolidation.py \
            tests/test_native_phase42_routes.py

      - name: Run broad first-party test suite (excluding live-provider scripts)
        run: |
          python -m pytest -q tests \
            --ignore=tests/test_pika_real_cohere_repair.py \
            --ignore=tests/test_pika_brain_real_repair.py

      - name: Run legacy root-level regression suite
        run: |
          python -m pytest -q \
            --ignore=test_api_workers.py \
            --ignore=test_pika_api.py

      - name: Run read-only Phase 36 architecture audit
        run: |
          python -m core.phase36 --output /tmp/pika-phase36-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/pika-phase36-audit.json").read_text())
          assert report.get("mode") == "read_only"
          governance = report.get("governance", {})
          assert governance.get("source_modified") is False
          assert governance.get("project_code_executed") is False
          assert governance.get("automatic_promotion_enabled") is False
          assert governance.get("approval_required_for_promotion") is True
          print(json.dumps({
              "source_summary": report.get("source_summary"),
              "finding_count": len(report.get("findings", [])),
              "governance": governance,
          }, indent=2))
          PY

  pc-body-sandbox:
    name: PC body Docker isolation smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install host test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.2.0 pytest-asyncio==1.5.0 cryptography==50.0.2

      - name: Build PIKA PC sandbox image
        run: docker build --pull -f sandbox/pc/Dockerfile -t pika-pc-sandbox:ci .

      - name: Pin the local image ID
        shell: bash
        run: |
          set -euo pipefail
          echo "PIKA_PC_SANDBOX_IMAGE_ID=$(docker image inspect pika-pc-sandbox:ci --format '{{.Id}}')" >> "$GITHUB_ENV"

      - name: Verify non-root, read-only and networkless isolation
        run: |
          python pika_pc.py run-tests \
            --source tests/test_pc_sandbox_probe.py \
            --test tests/test_pc_sandbox_probe.py \
            --timeout 15 \
            --acknowledge-untrusted-sandbox
