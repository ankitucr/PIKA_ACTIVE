name: PIKA Core Safety Regression

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "tests/**"
      - "pika_live.py"
      - "requirements.txt"
      - ".github/workflows/pika-core-safety.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "tests/**"
      - "pika_live.py"
      - "requirements.txt"
      - ".github/workflows/pika-core-safety.yml"

permissions:
  contents: read

jobs:
  phase36-trust-and-repair:
    name: Python ${{ matrix.python-version }} safety suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/pika-core-safety.yml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.2.0 pytest-asyncio==1.5.0 cryptography==50.0.2

      - name: Compile all first-party Python
        run: python -m compileall -q core agents tests pika_live.py

      - name: Prepare best-effort local diagnostic venv (not an OS sandbox)
        run: python -m core.evolution.local_runner setup

      - name: Run focused safety and learning regressions
        run: |
          python -m pytest -q \
            tests/test_phase35_verified_save.py \
            tests/test_phase36_attestor_config.py \
            tests/test_phase36_4_attestation.py \
            tests/test_phase36_5_attestor_policy.py \
            tests/test_phase36_7_staging.py \
            tests/test_phase36_8_ledger_presence.py \
            tests/test_phase36_failure_analysis.py \
            tests/test_phase36_failure_context.py \
            tests/test_phase36_local_diagnostics.py \
            tests/test_pika_brain_native_generator_integration.py \
            tests/test_live_runtime_think_handoff.py

      - name: Run broad first-party test suite (excluding live-provider scripts)
        run: |
          python -m pytest -q tests \
            --ignore=tests/test_pika_real_cohere_repair.py \
            --ignore=tests/test_pika_brain_real_repair.py
