# Install as a site under nginx; replace the certificate paths and hostname.
server {
    listen 443 ssl;
    http2 on;
    server_name attestor.example.com;

    ssl_certificate     /etc/letsencrypt/live/attestor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attestor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 66m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 930s;
    proxy_read_timeout 930s;

    location = /health {
        proxy_pass http://127.0.0.1:8765/health;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        deny all;
    }

    location = /v1/run {
        limit_except POST { deny all; }
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8765/v1/run;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}
